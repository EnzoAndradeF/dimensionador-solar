name: CD Deploy to AWS EC2

on:
  workflow_run:
    workflows: [CI Build and Push Docker Image]
    types:
      - completed

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}

    steps:
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo docker system prune -af
            sudo docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dimensionador-solar:latest
            sudo docker stop app-solar || true
            sudo docker rm app-solar || true
            sudo docker run -d -p 80:8501 --restart always --name app-solar ${{ secrets.DOCKERHUB_USERNAME }}/dimensionador-solar:latest