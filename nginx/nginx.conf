events {
    worker_connections 1024;
}

http {
    # Redireciona HTTP (80) -> HTTPS (443)
    server {
        listen 80;
        server_name dimensionador-solar.duckdns.org;
        return 301 https://$host$request_uri;
    }

    # Servidor HTTPS (443)
    server {
        listen 443 ssl;
        server_name dimensionador-solar.duckdns.org;

        ssl_certificate /etc/letsencrypt/live/dimensionador-solar.duckdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dimensionador-solar.duckdns.org/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location / {
            proxy_pass http://dimensionador_solar_frontend:8501;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 86400;
        }

        location /api/ {
            proxy_pass http://dimensionador_solar_backend:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}